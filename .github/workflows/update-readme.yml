name: Update README Timestamp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Update UTC date
        shell: bash
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          if grep -q "Last reviewed:" README.md; then
            sed -i "s/Last reviewed:.*/Last reviewed: $DATE/" README.md
          else
            printf "\\nLast reviewed: %s\\n" "$DATE" >> README.md
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already current."
            exit 0
          fi
          git commit -m "docs: update README review date"
          git push

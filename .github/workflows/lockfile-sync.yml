name: Sync npm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-lockfile-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate, verify, and commit package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Regenerate, verify, and push with concurrency retries
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "::group::Lockfile synchronization attempt ${attempt}/5"

            # Always work from the newest main. If another maintainer commits
            # while this job is running, the next attempt regenerates from that
            # new manifest instead of pushing a stale lockfile commit.
            git fetch origin main
            git reset --hard origin/main

            npm install --package-lock-only --ignore-scripts
            npm ci
            npm run lint
            npm test
            npm run build
            python scripts/validate_repo.py
            python scripts/validate_docs.py
            npm audit --audit-level=critical
            npm audit --omit=dev --audit-level=high

            if git diff --quiet -- package-lock.json; then
              echo "The committed lockfile already matches package.json."
              echo "::endgroup::"
              exit 0
            fi

            git add package-lock.json
            git commit -m "chore: sync npm lockfile"

            if git push origin HEAD:main; then
              echo "Lockfile update committed directly to main."
              echo "::endgroup::"
              exit 0
            fi

            echo "main moved during the run. Refreshing and retrying."
            echo "::endgroup::"
            sleep 2
          done

          echo "Lockfile synchronization could not push after five attempts." >&2
          exit 1

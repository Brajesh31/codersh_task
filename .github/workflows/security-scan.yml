name: Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - package.json
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Report full dependency audit findings
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log('Full dependency audit:', JSON.stringify(summary));
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: finding.severity,
              direct: finding.isDirect,
              range: finding.range,
              fixAvailable: finding.fixAvailable
            }));
          }
          NODE
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

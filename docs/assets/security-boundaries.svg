<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc"><title id="title">Current security boundary</title><desc id="desc">The website is a static public app. Visitors can download employee JSON; there is no authentication, database, server-side authorization, or private employee data boundary.</desc><defs><style>.b{fill:#fff;stroke:#d8dfec;stroke-width:2}.h{font:700 19px Arial;fill:#28334d}.s{font:15px Arial;fill:#68748b}.warn{fill:#fff2e9;stroke:#e9b48b;stroke-width:2}</style></defs><rect width="1100" height="330" rx="24" fill="#f5f7fc"/><text x="48" y="52" class="h">Current trust boundary</text><rect x="45" y="100" width="290" height="170" rx="18" class="b"/><text x="190" y="142" text-anchor="middle" class="h">Visitor browser</text><text x="190" y="177" text-anchor="middle" class="s">React UI</text><text x="190" y="205" text-anchor="middle" class="s">Client-side filtering</text><text x="190" y="233" text-anchor="middle" class="s">Local preferences</text><path d="M335 185H425" stroke="#c37a37" stroke-width="4" stroke-dasharray="8 7"/><path d="m415 175 10 10-10 10" stroke="#c37a37" stroke-width="4" fill="none"/><rect x="425" y="100" width="270" height="170" rx="18" class="warn"/><text x="560" y="142" text-anchor="middle" class="h">Public static asset</text><text x="560" y="177" text-anchor="middle" class="s">employeesData.json</text><text x="560" y="205" text-anchor="middle" class="s">Downloadable by every visitor</text><text x="560" y="233" text-anchor="middle" class="s">No authorization layer</text><rect x="760" y="100" width="295" height="170" rx="18" class="b"/><text x="907" y="142" text-anchor="middle" class="h">Not present</text><text x="907" y="177" text-anchor="middle" class="s">Authentication or roles</text><text x="907" y="205" text-anchor="middle" class="s">Private backend / database</text><text x="907" y="233" text-anchor="middle" class="s">Audit log / access checks</text></svg>

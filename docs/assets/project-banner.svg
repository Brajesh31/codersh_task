<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc"><title id="title">Employee Directory</title><desc id="desc">A clean illustration of an employee directory with profile cards, search, and teams.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222d60"/><stop offset="1" stop-color="#596dc9"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eef1ff"/></linearGradient></defs><rect width="1400" height="420" rx="32" fill="url(#bg)"/><circle cx="1230" cy="40" r="230" fill="#fff" opacity=".06"/><circle cx="1100" cy="430" r="210" fill="#b6bfff" opacity=".09"/><text x="92" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="6">PEOPLE · TEAMS · CONNECTIONS</text><text x="88" y="235" fill="#fff" font-family="Arial,sans-serif" font-size="76" font-weight="700">Employee</text><text x="88" y="315" fill="#fff" font-family="Arial,sans-serif" font-size="76" font-weight="700">Directory</text><text x="94" y="365" fill="#dce2ff" font-family="Arial,sans-serif" font-size="23">Find the people behind the work.</text><g transform="translate(820 75)"><rect width="485" height="270" rx="26" fill="#fff" opacity=".12"/><rect x="25" y="25" width="435" height="46" rx="13" fill="#fff"/><circle cx="54" cy="48" r="9" fill="none" stroke="#7684bd" stroke-width="3"/><path d="m61 55 8 8" stroke="#7684bd" stroke-width="3" stroke-linecap="round"/><text x="87" y="54" fill="#8791ac" font-family="Arial,sans-serif" font-size="16">Search employees...</text><g transform="translate(25 95)"><rect width="128" height="145" rx="18" fill="url(#card)"/><circle cx="64" cy="48" r="26" fill="#c4cdfb"/><rect x="26" y="88" width="76" height="10" rx="5" fill="#5a67b7"/><rect x="36" y="108" width="56" height="7" rx="3.5" fill="#b5bdd9"/></g><g transform="translate(178 95)"><rect width="128" height="145" rx="
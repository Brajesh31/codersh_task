<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">Static deployment flow</title><desc id="desc">Install dependencies, run lint and unit tests, build with Vite, review the distribution folder, and publish the static assets with SPA fallback.</desc><defs><style>.b{fill:#fff;stroke:#dce2ef;stroke-width:2}.h{font:700 18px Arial;fill:#25314b}.s{font:14px Arial;fill:#69748b}.a{fill:none;stroke:#6374bd;stroke-width:3}</style></defs><rect width="1100" height="320" rx="24" fill="#f5f7fc"/><text x="48" y="52" class="h">Static site release path</text><g><rect x="45" y="115" width="170" height="105" rx="15" class="b"/><text x="130" y="157" text-anchor="middle" class="h">Install</text><text x="130" y="185" text-anchor="middle" class="s">npm ci</text><path d="M215 167H260" class="a"/><path d="m250 157 10 10-10 10" class="a"/><rect x="260" y="115" width="170" height="105" rx="15" class="b"/><text x="345" y="157" text-anchor="middle" class="h">Verify</text><text x="345" y="185" text-anchor="middle" class="s">lint + test</text><path d="M430 167H475" class="a"/><path d="m465 157 10 10-10 10" class="a"/><rect x="475" y="115" width="170" height="105" rx="15" class="b"/><text x="560" y="157" text-anchor="middle" class="h">Build</text><text x="560" y="185" text-anchor="middle" class="s">npm run build</text><path d="M645 167H690" class="a"/><path d="m680 157 10 10-10 10" class="a"/><rect x="690" y="115" width="170" height="105" rx="15" class="b"/><text x="775" y="157" text-anchor="middle" class="h">Review dist/</text><text x="775" y="185" text-anchor="middle" class="s">assets + public data</text><path d="M860 167H905" class="a"/><path d="m895 157 10 10-10 10" class="a"/><rect x="905" y="115" width="150" height="105" rx="15" class="b"/><text x="980" y="157" text-anchor="middle" class="h">Publish</text><text x="980" y="185" text-anchor="middle" class="s">static host</text></g></svg>

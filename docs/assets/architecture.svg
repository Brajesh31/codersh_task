<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Employee directory architecture</title><desc id="d">Browser React application loads a static public JSON file and renders the employee cards and detail dialog. Local storage holds filter preferences.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5367c9"/><stop offset="1" stop-color="#8b78d7"/></linearGradient><style>.h{font:700 23px Arial;fill:#18233a}.p{font:16px Arial;fill:#5e6b82}.s{font:700 15px Arial;fill:#fff}.b{fill:#fff;stroke:#dce2ef;stroke-width:2}</style></defs><rect width="1200" height="560" rx="26" fill="#f5f7fc"/><text x="60" y="64" class="h">Current application architecture</text><rect x="60" y="115" width="285" height="330" rx="20" class="b"/><rect x="85" y="145" width="235" height="66" rx="13" fill="url(#g)"/><text x="202" y="185" text-anchor="middle" class="s">Browser</text><text x="90" y="255" class="h">React + Vite</text><text x="90" y="290" class="p">App / Home page</text><text x="90" y="320" class="p">Search and department filter</text><text x="90" y="350" class="p">Employee cards and dialog</text><text x="90" y="395" class="p">Local filter preferences</text><path d="M345 280H475" stroke="#7a86a0" stroke-width="3" fill="none"/><path d="m463 269 12 11-12 11" stroke="#7a86a0" stroke-width="3" fill="none"/><rect x="475" y="165" width="250" height="230" rx="20" class="b"/><rect x="500" y="190" width="200" height="56" rx="12" fill="url(#g)"/><text x="600" y="225" text-anchor="middle" class="s">HTTP GET</text><text x="510" y="285" class="h">Public JSON</text><text x="510" y="320" class="p">employeesData.json</text><text x="510" y="355" class="p">Whole file is downloadable</text><path d="M725 280H850" stroke="#7a86a0" stroke-width="3" fill="none"/><path d="m838 269 12 11-12 11" stroke="#7a86a0" stroke-width="3" fill="none"/><rect x="850" y="165" width="290" height="230" rx="20" class="b"/><rect x="875" y="190" width="240" height="56" rx="12" fill="url(#g)"/><text x="995" y="225" text-anchor="middle" class="s">Rendered directory</text><text x="885" y="285" class="h">Results</text><text x="885" y="320" class="p">Cards, filters, empty state</text><text x="885" y="355" class="p">Profile detail dialog</text><text x="60" y="505" class="p">No backend, database, login, or write API is present in the current repository.</text></svg>
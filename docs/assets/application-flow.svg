<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Employee directory application flow</title><desc id="desc">The user opens the page, the frontend loads and normalizes JSON, renders employee cards, filters results, and opens a profile dialog. Failed requests lead to an error and retry state.</desc><defs><style>.n{fill:#fff;stroke:#d8deed;stroke-width:2}.h{font:700 18px Arial;fill:#26324b}.p{font:14px Arial;fill:#68748b}.a{stroke:#7886bd;stroke-width:3;fill:none}</style></defs><rect width="1200" height="430" rx="24" fill="#f6f8fc"/><text x="55" y="55" class="h">Application workflow</text><g><rect x="45" y="145" width="175" height="105" rx="16" class="n"/><text x="132" y="185" text-anchor="middle" class="h">Open directory</text><text x="132" y="215" text-anchor="middle" class="p">Show loading</text><path d="M220 198H275" class="a"/><path d="m265 188 10 10-10 10" class="a"/><rect x="275" y="145" width="175" height="105" rx="16" class="n"/><text x="362" y="185" text-anchor="middle" class="h">Fetch JSON</text><text x="362" y="215" text-anchor="middle" class="p">Normalize rows</text><path d="M450 198H505" class="a"/><path d="m495 188 10 10-10 10" class="a"/><rect x="505" y="145" width="175" height="105" rx="16" class="n"/><text x="592" y="185" text-anchor="middle" class="h">Render cards</text><text x="592" y="215" text-anchor="middle" class="p">Show result count</text><path d="M680 198H735" class="a"/><path d="m725 188 10 10-10 10" class="a"/><rect x="735" y="145" width="175" height="105" rx="16" class="n"/><text x="822" y="185" text-anchor="middle" class="h">Search / filter</text><text x="822" y="215" text-anchor="middle" class="p">Refine the list</text><path d="M910 198H965" class="a"/><path d="m955 188 10 10-10 10" class="a"/><rect x="965" y="145" width="190" height="105" rx="16" class="n"/><text x="1060" y="185" text-anchor="middle" class="h">Open profile</text><text x="1060" y="215" text-anchor="middle" class="p">Dialog / close</text><rect x="275" y="300" width="175" height="75" rx="14" class="n"/><text x="362" y="330" text-anchor="middle" class="h">Error state</text><text x="362" y="352" text-anchor="middle" class="p">Retry request</text><path d="M362 250V300" class="a"/></g></svg>

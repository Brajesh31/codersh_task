<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Employee data flow</title><desc id="desc">A public JSON asset is fetched by the browser, validated and normalized, filtered in memory, and displayed as cards or details. Only filter preferences are stored locally.</desc><defs><style>.box{fill:#fff;stroke:#dce2ef;stroke-width:2}.t{font:700 18px Arial;fill:#27334d}.s{font:14px Arial;fill:#68748b}.l{stroke:#6374bd;stroke-width:3;fill:none}</style></defs><rect width="1200" height="360" rx="24" fill="#f6f8fc"/><text x="50" y="54" class="t">Data flow and persistence</text><g><rect x="45" y="125" width="210" height="120" rx="16" class="box"/><text x="150" y="169" class="t" text-anchor="middle">Public JSON</text><text x="150" y="199" class="s" text-anchor="middle">Static employee rows</text><path d="M255 185H330" class="l"/><path d="m320 175 10 10-10 10" class="l"/><rect x="330" y="125" width="210" height="120" rx="16" class="box"/><text x="435" y="169" class="t" text-anchor="middle">Normalize</text><text x="435" y="199" class="s" text-anchor="middle">Required fields + IDs</text><path d="M540 185H615" class="l"/><path d="m605 175 10 10-10 10" class="l"/><rect x="615" y="125" width="210" height="120" rx="16" class="box"/><text x="720" y="169" class="t" text-anchor="middle">Filter in memory</text><text x="720" y="199" class="s" text-anchor="middle">Name, email, department</text><path d="M825 185H900" class="l"/><path d="m890 175 10 10-10 10" class="l"/><rect x="900" y="125" width="245" height="120" rx="16" class="box"/><text x="1022" y="169" class="t" text-anchor="middle">Rendered UI</text><text x="1022" y="199" class="s" text-anchor="middle">Cards + selected details</text><rect x="330" y="280" width="210" height="48" rx="12" fill="#e8ebff" stroke="#cdd4f3"/><text x="435" y="310" class="s" text-anchor="middle">localStorage: filter choices</text><path d="M435 245V280" class="l"/></g></svg>
